<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Bookmarks — Hadith</title>
    <meta name="description" content="Hadiths you've saved, organized into folders you name. Stored on this device only.">

    <script>
        (function () {
            var saved = localStorage.getItem("theme");
            var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
            if (saved === "dark" || (!saved && prefersDark)) {
                document.documentElement.classList.add("dark");
            }
        })();
    </script>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600;700&family=Noto+Naskh+Arabic:wght@400;700&family=Scheherazade+New:wght@400;500&display=swap" rel="stylesheet">

    <link rel="icon" href="favicons/favicon.ico" type="image/x-icon">
    <link rel="icon" type="image/png" sizes="32x32" href="favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicons/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="favicons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="favicons/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="favicons/android-chrome-512x512.png">
    <link rel="manifest" href="favicons/site.webmanifest">
    <meta name="theme-color" content="#f6f2ea" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0a0f14" media="(prefers-color-scheme: dark)">
</head>
<body>

<div class="backdrop" aria-hidden="true">
    <div class="glow glow-a"></div>
    <div class="glow glow-b"></div>
</div>
<div id="stars" aria-hidden="true"></div>

<header class="site-header">
    <a class="logo" href="index">
        <span class="logo-mark" aria-hidden="true">﴾</span>
        Hadith
    </a>

    <nav class="site-nav" id="nav-menu">
        <a href="index">Home</a>
        <a href="bookmarks" aria-current="page">Bookmarks</a>
        <a href="about">About</a>
        <a href="contact">Contact</a>
    </nav>

    <button class="icon-btn" id="theme-btn" type="button" aria-label="Toggle dark mode">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4.2"></circle>
            <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"></path>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.5 8.5 0 1 0 10.2 10.2z"></path>
        </svg>
    </button>

    <button class="icon-btn hamburger" id="hamburger" type="button" aria-label="Menu" aria-expanded="false" aria-controls="nav-menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16"></path>
        </svg>
    </button>
</header>

<main class="shell">
    <div class="hero-head">
        <span class="eyebrow">Your library</span>
        <h1>Bookmarks</h1>
        <p>Hadiths you've saved, organized into folders you name — kept on this device only.</p>
    </div>

    <div id="bookmarks-root"></div>
</main>

<footer class="site-footer">
    <div class="shell">
        <span>Hadith — built for quiet reading.</span>
        <span>Texts via <a href="https://hadithapi.com" target="_blank" rel="noopener">HadithAPI</a></span>
    </div>
</footer>

<!-- Card export dialog, for sharing a saved Hadith -->
<div class="modal" id="bm-card-modal" role="dialog" aria-modal="true" aria-labelledby="bm-card-modal-title" aria-hidden="true">
    <div class="modal-panel">
        <div class="modal-head">
            <div>
                <h2 id="bm-card-modal-title">Share this Hadith</h2>
                <p>1080 &times; 1080 — sized for an Instagram post.</p>
            </div>
            <button class="icon-btn" id="bm-modal-close" type="button" aria-label="Close" style="margin-left:auto">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
                    <path d="M6 6l12 12M18 6L6 18"></path>
                </svg>
            </button>
        </div>

        <div class="preview-frame" id="bm-preview-frame">
            <img id="bm-card-preview" alt="Preview of the Hadith card">
        </div>

        <div class="card-options">
            <div class="segmented" role="group" aria-label="Card style">
                <button type="button" data-bm-card-theme="light" aria-pressed="true">Light</button>
                <button type="button" data-bm-card-theme="dark" aria-pressed="false">Dark</button>
            </div>

            <button class="chip" id="bm-card-arabic-btn" type="button" aria-pressed="true" hidden>
                <span class="chip-glyph" aria-hidden="true">ع</span>
                Include Arabic
            </button>
        </div>

        <div class="modal-actions">
            <button class="btn btn-primary" id="bm-share-btn" type="button" hidden>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 3.5v12"></path><path d="M8 7.5L12 3.5l4 4"></path>
                    <path d="M5 13.5v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"></path>
                </svg>
                Share the image
            </button>
            <button class="btn btn-primary" id="bm-download-btn" type="button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 3.5v11"></path><path d="M7.5 10.5L12 15l4.5-4.5"></path><path d="M4.5 19.5h15"></path>
                </svg>
                Save to device
            </button>
        </div>

        <div class="share-row" style="grid-template-columns: 1fr">
            <button class="share-target" id="bm-copy-image-btn" type="button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="9" y="9" width="11" height="11" rx="2.5"></rect>
                    <path d="M5.5 15H5a1.5 1.5 0 0 1-1.5-1.5V5A1.5 1.5 0 0 1 5 3.5h8.5A1.5 1.5 0 0 1 15 5v.5"></path>
                </svg>
                Copy image
            </button>
        </div>
    </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="card.js"></script>
<script src="script.js"></script>
<script src="bookmarks.js"></script>
</body>
</html>
