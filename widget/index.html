<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hadith Pull widget</title>
    <meta name="robots" content="noindex">
    <link rel="canonical" href="https://hadithpull.online/">
    <!--
        The address to give a browser's "webpage widget" (Vivaldi's start page, for one):
        https://hadithpull.online/widget/
        It opens the reader in its widget layout: the narration, its reference and New Hadith, nothing else.
    -->
    <meta http-equiv="refresh" content="0; url=/?widget">
    <script>location.replace('/?widget');</script>
</head>
<body><a href="/?widget">Hadith Pull</a></body>
</html>
