<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Contact — Hadith</title>
    <meta name="description" content="Send a message about this project.">

    <script>
        (function () {
            var saved = localStorage.getItem("theme");
            var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
            if (saved === "dark" || (!saved && prefersDark)) {
                document.documentElement.classList.add("dark");
            }
        })();
    </script>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="icon" href="favicons/favicon.ico" type="image/x-icon">
    <link rel="icon" type="image/png" sizes="32x32" href="favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicons/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="favicons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="favicons/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="favicons/android-chrome-512x512.png">
    <link rel="manifest" href="favicons/site.webmanifest">
    <meta name="theme-color" content="#f6f2ea" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0a0f14" media="(prefers-color-scheme: dark)">
</head>
<body>

<div class="backdrop" aria-hidden="true">
    <div class="glow glow-a"></div>
    <div class="glow glow-b"></div>
</div>
<div id="stars" aria-hidden="true"></div>

<header class="site-header">
    <a class="logo" href="index">
        <span class="logo-mark" aria-hidden="true">﴾</span>
        Hadith
    </a>

    <nav class="site-nav" id="nav-menu">
        <a href="index">Home</a>
        <a href="about">About</a>
        <a href="contact" aria-current="page">Contact</a>
    </nav>

    <button class="icon-btn" id="theme-btn" type="button" aria-label="Toggle dark mode">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4.2"></circle>
            <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"></path>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.5 8.5 0 1 0 10.2 10.2z"></path>
        </svg>
    </button>

    <button class="icon-btn hamburger" id="hamburger" type="button" aria-label="Menu" aria-expanded="false" aria-controls="nav-menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16"></path>
        </svg>
    </button>
</header>

<main class="shell">
    <div class="page">

        <h1>Contact</h1>
        <p class="lede">Corrections, ideas, or just salam — all welcome.</p>

        <section class="panel">
            <form id="contact-form">
                <div class="field">
                    <label for="name">Your name</label>
                    <input type="text" id="name" name="name" placeholder="Abdullah" autocomplete="name" required>
                </div>

                <div class="field">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" placeholder="Write your message…" required></textarea>
                </div>

                <button class="btn btn-primary" type="submit">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M20.5 3.5L10.5 13.5"></path>
                        <path d="M20.5 3.5l-6.4 17-3.6-7-7-3.6z"></path>
                    </svg>
                    Send message
                </button>
            </form>

            <p style="margin-top:1rem;font-size:0.85rem;color:var(--muted)">
                This opens a pre-filled email in a new tab — nothing is stored on this site.
            </p>
        </section>

    </div>
</main>

<footer class="site-footer">
    <div class="shell">
        <span>Hadith — built for quiet reading.</span>
        <span>Texts via <a href="https://hadithapi.com" target="_blank" rel="noopener">HadithAPI</a></span>
    </div>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
    document.getElementById("contact-form").addEventListener("submit", function (e) {
        e.preventDefault();

        const name = document.getElementById("name").value;
        const message = document.getElementById("message").value;

        const subject = encodeURIComponent("Message from " + name);
        const body = encodeURIComponent(message);

        window.open(
            `https://mail.google.com/mail/?view=cm&fs=1&to=aarahman803@gmail.com&su=${subject}&body=${body}`,
            "_blank"
        );
    });
</script>
<script src="script.js"></script>
</body>
</html>
