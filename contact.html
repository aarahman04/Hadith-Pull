<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Contact</title>
    <meta name="description" content="Send a message about this project.">

    <script>
        (function () {
            document.documentElement.dataset.readingLanguage = localStorage.getItem("readingLanguage") === "ar" ? "ar" : "en";
            var saved = localStorage.getItem("theme");
            var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
            if (saved === "dark" || (!saved && prefersDark)) {
                document.documentElement.classList.add("dark");
            }
        })();
    </script>

    <link rel="stylesheet" href="style.css?v=20261026-arabic-1">

    <link rel="icon" type="image/png" href="favicons/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="favicons/favicon.svg">
    <link rel="shortcut icon" href="favicons/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="favicons/apple-touch-icon.png">
    <link rel="manifest" href="favicons/site.webmanifest">
    <meta name="theme-color" content="#f6f2ea" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0a0f14" media="(prefers-color-scheme: dark)">
</head>
<body>

<div class="backdrop" aria-hidden="true">
    <div class="glow glow-a"></div>
    <div class="glow glow-b"></div>
</div>
<div id="stars" aria-hidden="true"></div>

<header class="site-header">
    <a class="brand" href="./">
        <span class="logo-mark" aria-hidden="true"><img src="favicons/web-app-manifest-192x192.png" alt="" width="24" height="24"></span>
        Hadith Pull
    </a>

    <nav class="site-nav" aria-label="Primary">
        <a href="./">Read</a>
        <a href="bookmarks">Bookmarks</a>
        <a href="about" aria-current="page">About</a>
    </nav>

    <div class="header-actions">
        <button class="icon-btn" id="theme-btn" type="button" aria-label="Toggle dark mode" title="Toggle dark mode (right-click or hold for more)">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
                <circle cx="12" cy="12" r="4.2"></circle>
                <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"></path>
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.5 8.5 0 1 0 10.2 10.2z"></path>
            </svg>
        </button>
    </div>
</header>

<main>
    <div class="page">

        <div class="screen-hero">
            <span class="eyebrow">Get in touch</span>
            <h1>Contact</h1>
            <p>Corrections, ideas, or just salam — all welcome.</p>
        </div>

        <section class="panel">
            <form id="contact-form">
                <div class="field">
                    <label for="name">Your name</label>
                    <input type="text" id="name" name="name" placeholder="Abdullah" autocomplete="name" required>
                </div>

                <div class="field">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" placeholder="Write your message…" required></textarea>
                </div>

                <button class="btn btn-primary" type="submit">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M20.5 3.5L10.5 13.5"></path>
                        <path d="M20.5 3.5l-6.4 17-3.6-7-7-3.6z"></path>
                    </svg>
                    Send message
                </button>
            </form>

            <p style="margin-top:1rem;font-size:0.85rem;color:var(--muted)">
                This opens a pre-filled email in a new tab — nothing is stored on this site.
            </p>
        </section>

    </div>
</main>

<footer class="site-footer">
    <div class="shell">
        <span>Read and reflect with Hadith Pull.</span>
        <span>Texts from <a href="https://sunnah.com/" target="_blank" rel="noopener">Sunnah.com</a></span>
        <span><a href="privacy">Privacy</a></span>
    </div>
</footer>

<nav class="tabbar" aria-label="Primary">
    <a href="./">
        <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 5.8c2.9-1.1 5.7-.8 8.5 1.2 2.8-2 5.6-2.3 8.5-1.2v12.6c-2.9-1.1-5.7-.8-8.5 1.2-2.8-2-5.6-2.3-8.5-1.2z"></path><path d="M12 7v12.6"></path></svg></span>
        Read
    </a>
    <a href="bookmarks">
        <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 4.5h11a1 1 0 0 1 1 1v13.6a.5.5 0 0 1-.77.42L12 15.4l-5.73 3.62a.5.5 0 0 1-.77-.42V5.5a1 1 0 0 1 1-1z"></path></svg></span>
        Bookmarks
    </a>
    <a href="about" aria-current="page">
        <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 11v5.2"></path><path d="M12 7.8v.1"></path></svg></span>
        About
    </a>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="navigation.js?v=20261026-arabic-1"></script>
</body>
</html>
