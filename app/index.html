<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <title>Open Hadith Pull</title>
    <meta name="description" content="Open Hadith Pull on the web or get the Android app on Google Play.">
    <meta property="og:title" content="Hadith Pull">
    <meta property="og:description" content="A quiet place to read one narration at a time. Open the website or get the Android app.">
    <meta property="og:image" content="https://hadithpull.online/og-image.png">
    <meta name="twitter:card" content="summary_large_image">
    <script>
        // Android opens the listing in Chrome, so it shows even when the Play app is signed out;
        // other browsers fall back to the same listing URL.
        location.replace(/Android/i.test(navigator.userAgent)
            ? 'intent://play.google.com/store/apps/details?id=online.hadithpull.app#Intent;scheme=https;package=com.android.chrome;' +
                'S.browser_fallback_url=https%3A%2F%2Fplay.google.com%2Fstore%2Fapps%2Fdetails%3Fid%3Donline.hadithpull.app;end'
            : '/');
    </script>
    <link rel="stylesheet" href="/style.css">
    <link rel="icon" href="/favicons/favicon.ico">
    <style>
        body { justify-content: center; }
        main { flex: none; max-width: 420px; text-align: center; }
        .logo-mark { margin: 0 auto 24px; }
        .btn { margin: 12px 0; }
    </style>
</head>
<body>
    <main>
        <span class="logo-mark" aria-hidden="true"><img src="/favicons/web-app-manifest-192x192.png" alt="" width="32" height="32"></span>
        <div class="screen-hero">
            <h1>Hadith Pull</h1>
            <p>Opening Hadith Pull for your device…</p>
        </div>
        <a class="btn btn-primary btn-block" href="/">Read on the website</a>
        <a class="btn btn-block" href="https://play.google.com/store/apps/details?id=online.hadithpull.app">Get the Android app</a>
    </main>
</body>
</html>
